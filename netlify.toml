# ==============================================================================
# CONFIGURACIÓN DE DESPLIEGUE EN NETLIFY
# ==============================================================================
# Este archivo configura los procesos de compilación, ruteo y optimización de
# metadatos para el Protocolo de Acción Inmediata (PAI).

[build]
  # Comando de instalación y compilación del frontend de React (Vite)
  command = "npm install --prefix frontend && npm run build --prefix frontend"
  # Directorio final compilado para publicar en producción
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy seguro SAC → Function (inyecta SAC_AUTOMATION_TOKEN).
# force=true gana al redirect genérico /api/* (backend = Docker local vía registry).
[[redirects]]
  from = "/api/sac"
  to = "/.netlify/functions/sac-proxy/sac"
  status = 200
  force = true

[[redirects]]
  from = "/api/sac/*"
  to = "/.netlify/functions/sac-proxy/:splat"
  status = 200
  force = true

# Proxy genérico del resto del backend (status, send-pdf, groups, etc.)
# Destino real = registry de tunnels (Docker local). Nunca Render.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/:splat"
  status = 200
  force = true

# Cabeceras personalizadas para optimización y cache
[[headers]]
  for = "/*"
  [headers.values]
    # NOTA: Se ha removido 'X-Frame-Options = "DENY"' para permitir que la página
    # se integre correctamente dentro del iframe de Google Sites.
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Políticas de caché por defecto para single-page app (SPA)
    # Permite al navegador validar el estado de los archivos en cada carga
    Cache-Control = "public, max-age=0, must-revalidate"
