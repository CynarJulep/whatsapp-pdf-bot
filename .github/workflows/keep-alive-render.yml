# Keep-alive LOCAL — no pegar Render.
#
# Histórico: este workflow despertaba whatsapp-pdf-bot-backend.onrender.com
# y whatsapp-licencias-bot.onrender.com cada 10 min (plan free). Eso mantenía
# un segundo bot vivo con las mismas session_id que Docker → WhatsApp 440.
#
# Prod actual = Docker en la PC + tunnels + Netlify.
# El ping útil es la scheduled function de Netlify (keep-alive-render.mjs),
# que lee el registry de tunnels. Este workflow queda SOLO manual, y si se
# dispara pega el sitio (proxy → tunnel), nunca onrender.
#
# En GitHub está disabled_manually. No lo reactives con URLs de Render.
name: Keep-alive local

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping sitio Netlify (proxy al Docker local)
        run: |
          set -e
          url="https://ac-pai-wp.netlify.app/api/ping"
          echo "→ $url"
          curl -fsS --max-time 25 -H "Accept: application/json" "$url"
          echo
